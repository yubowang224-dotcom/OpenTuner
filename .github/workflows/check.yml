name: Check OpenTuner
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify generated translations and formatting
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          dart format --output=none --set-exit-if-changed lib test tools/capture_preview.dart tools/capture_tools1_preview.dart tools/capture_appearance_preview.dart tools/capture_m1_preview.dart tools/capture_m2_preview.dart tools/capture_m3_preview.dart tools/capture_release_prep.dart tools/export_stretch_targets.dart
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Production immutable Android request admission (JVM, not permission UI)
        run: |
          mkdir -p build/request-tests
          javac -d build/request-tests android/app/src/main/java/org/opentune/tuner/InputRequest.java tools/tests/InputRequestTest.java
          java -cp build/request-tests InputRequestTest
      - name: Production C++ DSP tests
        run: |
          python3 tools/verify_baseline.py
          cmake -S native -B build/dsp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/dsp --parallel 2
          ctest --test-dir build/dsp --output-on-failure
          python3 tools/sync_waveform_fixtures.py --source build/dsp/waveform-results --check
          dart run tools/export_stretch_targets.dart build/dsp/partial-results build/dsp/stretch-targets
          build/dsp/partial_curve_loop build/dsp/stretch-targets/curve-strong.csv build/dsp/curve-loop
          python3 tools/sync_partial_fixtures.py --source build/dsp/partial-results --curve-source build/dsp/curve-loop --check
          python3 tools/check_metronome_fixture.py --source build/dsp/transport-results/fixture.json
          javac -d build/request-tests android/app/src/main/java/org/opentune/tuner/MetronomeStatus.java tools/tests/MetronomeStatusTest.java
          java -cp build/request-tests MetronomeStatusTest build/dsp/transport-results/fixture.json
      - name: Android debug build
        run: flutter build apk --debug
      - name: Save debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentuner-debug-and-dsp
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/dsp/results/*.csv
            build/dsp/evaluation/*.csv
            build/dsp/evaluation/profile.json
            build/dsp/metronome-results/*.csv
            build/dsp/waveform-results/*
            build/dsp/guitar-results/*.csv
            build/dsp/guitar-results/*.json
            build/dsp/voice-results/*.csv
            build/dsp/piano-results/*
            build/dsp/piano-state/*.csv
            build/dsp/piano-tones/*.csv
            build/dsp/partial-results/*
            build/dsp/partial-edges/*
            build/dsp/stretch-targets/*
            build/dsp/curve-loop/*
            build/dsp/transport-results/*
          if-no-files-found: error
          retention-days: 7
