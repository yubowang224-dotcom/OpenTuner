org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Direct GitHub APK channels share a monotonically increasing versionCode,
# including split and universal APKs. No ABI*1000 offsets for future releases.
force-version-code-ignoring-abi=true
# Do not serialize signing environment into a Gradle configuration cache.
org.gradle.configuration-cache=false
